<style>
:root{
--hp:#2f9e57; --hc:#2f6fe0; --vula:#e07d2f; --mobil:#6b7683;
--electi:#000089; --electi-dark:#000063; --electi-tint:#ecedf7;
--bg:#ffffff; --ink:#12181f; --muted:#5c6773; --line:#e4e8ee;
--shadow:0 6px 24px rgba(10,20,40,.18);
--font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
--font-display: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%; font-family:var(--font); color:var(--ink); background:var(--bg);}
#map{position:absolute; inset:0; z-index:0;}
.topbar{ position:absolute; top:0; left:0; right:0; z-index:1000; }
.brandbar{
background:var(--electi); color:#fff;
padding:calc(env(safe-area-inset-top,0) + 9px) 13px 9px;
display:flex; align-items:center; justify-content:space-between; gap:10px;
box-shadow:0 2px 12px rgba(0,0,90,.30);
}
.controls{
background:rgba(255,255,255,.96); backdrop-filter:saturate(1.4) blur(6px);
border-bottom:1px solid var(--line);
padding:8px 12px;
}
.brand{display:flex; align-items:center; gap:11px; min-width:0;}
.brand .logo{height:38px; width:auto; flex:none; display:block;}
.brand .vr{width:1px; align-self:stretch; background:rgba(255,255,255,.28); margin:4px 0;}
.brandtext{min-width:0; display:flex; flex-direction:column; justify-content:center;}
.title{font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:.2px; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brandtext .date{font-size:11.5px; color:rgba(255,255,255,.72); font-weight:600; letter-spacing:.4px;}
.remaining{font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--electi); background:#fff; white-space:nowrap; padding:6px 12px; border-radius:999px; letter-spacing:.2px; box-shadow:0 1px 6px rgba(0,0,50,.30);}
.remaining b{font-size:14px; font-weight:800; margin-right:1px;}
.areatabs{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.areatabs button{
flex:1 1 auto; min-width:70px; padding:8px 8px; font-size:13px; font-weight:600; font-family:inherit;
border:1px solid var(--line); background:#f3f5f8; color:var(--muted);
border-radius:9px; cursor:pointer;
}
.areatabs button.on{background:var(--electi); color:#fff; border-color:var(--electi);}
.chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.chip{
display:inline-flex; align-items:center; gap:6px;
padding:6px 10px; border-radius:999px; font-size:12.5px; font-weight:600;
border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; user-select:none;
}
.chip .dot{width:11px; height:11px; border-radius:50%; flex:none;}
.chip .n{color:var(--muted); font-weight:600;}
.chip.off{opacity:.4; text-decoration:line-through;}
.showdone{margin-top:8px; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);}
.showdone input{width:17px; height:17px;}
.searchwrap{position:relative; margin-top:8px;}
.searchwrap input{width:100%; font:inherit; font-size:15px; padding:11px 36px 11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
.searchwrap input::placeholder{color:var(--muted);}
.searchwrap input:focus{outline:none; border-color:var(--electi);}
.search-clear{position:absolute; top:9px; right:6px; border:none; background:none; font-size:19px; color:var(--muted); cursor:pointer; line-height:1; padding:6px 8px;}
.searchresults{position:absolute; top:calc(100% + 5px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:1400; max-height:min(52vh,340px); overflow-y:auto; -webkit-overflow-scrolling:touch;}
.search-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; border:none; border-bottom:1px solid var(--line); padding:11px 12px; cursor:pointer; font:inherit;}
.search-item:last-child{border-bottom:none;}
.search-item:active{background:#f5f7fb;}
.search-main{display:flex; flex-direction:column; min-width:0;}
.search-addr{font-weight:700; font-size:14.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.search-sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.search-empty{padding:12px; color:var(--muted); font-size:13.5px;}
.sheet{
position:absolute; left:0; right:0; bottom:0; z-index:1200;
background:#fff; border-radius:18px 18px 0 0; box-shadow:var(--shadow);
padding:16px 16px calc(env(safe-area-inset-bottom,0) + 16px);
transform:translateY(120%); transition:transform .22s ease; max-width:640px; margin:0 auto;
}
.sheet.open{transform:translateY(0);}
.sheet .grab{width:40px; height:4px; border-radius:3px; background:#d7dde5; margin:0 auto 12px;}
.sheet .addr{font-family:var(--font-display); font-size:19px; font-weight:700; line-height:1.25;}
.sheet .sub{font-size:13.5px; color:var(--muted); margin-top:3px;}
.badges{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 4px;}
.badge{font-size:12.5px; font-weight:700; color:#fff; padding:4px 10px; border-radius:999px;}
.badge.status{background:#eef1f5; color:var(--ink);}
.sheet .meta{font-size:13px; color:var(--muted); margin-top:8px;}
.actions{display:flex; gap:10px; margin-top:16px;}
.actions a, .actions button{
flex:1; text-align:center; padding:14px 8px; border-radius:12px;
font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; border:none; text-decoration:none;
}
.btn-nav{background:var(--electi); color:#fff;}
.btn-done{background:var(--ink); color:#fff;}
.btn-undo{background:#f3f5f8; color:var(--ink); border:1px solid var(--line);}
.sheet .close{position:absolute; top:12px; right:14px; font-size:22px; color:var(--muted); background:none; border:none; cursor:pointer; line-height:1;}
.scrim{position:absolute; inset:0; background:rgba(10,20,40,.28); z-index:1150; opacity:0; pointer-events:none; transition:opacity .2s;}
.scrim.open{opacity:1; pointer-events:auto;}
.leaflet-top.leaflet-right{margin-top:172px;}
.done-badge{background:#eef1f5; color:var(--muted);}
.meta a.sflink{color:var(--electi); font-weight:700; text-decoration:none;}
.meta a.mini{color:var(--electi); font-weight:700; text-decoration:none; white-space:nowrap;}
.stackbox{margin-top:12px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff;}
.stack-head{font-size:12.5px; font-weight:700; color:var(--electi); background:var(--electi-tint); padding:9px 12px;}
.stack-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; border:none; border-top:1px solid var(--line); padding:11px 12px; cursor:pointer; font:inherit;}
.stack-item:active{background:#f5f7fb;}
.stack-item.cur{background:#f3f5fb; cursor:default;}
.stack-main{display:flex; flex-direction:column; min-width:0; flex:1;}
.stack-bol{font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stack-sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stack-item .mini{flex:none;}
.stack-check{color:var(--hp); font-weight:800;}
.apptbox{margin-top:12px; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#f8f9fc;}
.apptbox.has{background:#fff7e6; border-color:#f0d488;}
.appt-row{display:flex; align-items:center; gap:8px;}
.appt-title{font-weight:700; font-size:14px; display:flex; align-items:center; gap:7px;}
.appt-when{font-family:var(--font-display); font-weight:800; color:#8a6d1a;}
.appt-form{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.appt-form input{font:inherit; padding:10px 11px; border:1px solid var(--line); border-radius:9px; flex:1 1 130px; min-width:120px; background:#fff;}
.appt-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.appt-actions button, .appt-actions a{font:inherit; font-weight:700; font-size:13.5px; padding:10px 13px; border-radius:9px; cursor:pointer; border:none; text-decoration:none; text-align:center;}
.appt-save{background:var(--electi); color:#fff;}
.appt-cal{background:#e8a90c; color:#3a2c00;}
.appt-open{background:#eef1f6; color:var(--electi);}
.appt-del{background:#eef1f6; color:#b3261e;}
.apptline{margin-top:9px;}
.apptline button{font:inherit; font-weight:700; font-size:12.5px; color:#8a6d1a; background:#fff7e6; border:1px solid #f0d488; border-radius:999px; padding:6px 12px; cursor:pointer;}
.apptsheet{max-height:min(72vh, 540px); display:flex; flex-direction:column;}
.apptsheet .apptsheet-title{font-family:var(--font-display); font-size:19px; font-weight:800; color:var(--electi);}
.apptsheet .apptsheet-hint{font-size:12.5px; color:var(--muted); margin:2px 0 10px;}
.appt-list{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0 -2px; padding:2px 2px 0;}
.appt-item{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:9px; cursor:pointer; font:inherit;}
.appt-item:active{background:#f5f7fb;}
.appt-dot{width:13px; height:13px; border-radius:50%; flex:none; box-shadow:0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.10);}
.appt-item-main{display:flex; flex-direction:column; min-width:0; flex:1;}
.appt-item-addr{font-weight:700; font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.appt-item-sub{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.appt-item-when{font-family:var(--font-display); font-weight:800; font-size:13px; color:#8a6d1a; background:#fff7e6; border:1px solid #f0d488; border-radius:999px; padding:5px 10px; flex:none; white-space:nowrap;}
.appt-item-when.past{color:var(--muted); background:#eef1f5; border-color:var(--line);}
.appt-empty{color:var(--muted); font-size:14px; padding:10px 2px;}
.locate{
position:absolute; right:12px; bottom:calc(env(safe-area-inset-bottom,0) + 40px); z-index:1100;
width:48px; height:48px; border-radius:50%; border:1px solid var(--line);
background:#fff; color:var(--electi); box-shadow:var(--shadow); cursor:pointer;
display:flex; align-items:center; justify-content:center; padding:0;
}
.locate.on{background:var(--electi); color:#fff; border-color:var(--electi);}
.toast{
position:absolute; left:50%; transform:translateX(-50%);
bottom:calc(env(safe-area-inset-bottom,0) + 100px); z-index:1300;
background:rgba(18,24,31,.92); color:#fff; font-size:13px; font-weight:600;
padding:10px 14px; border-radius:10px; max-width:80%; text-align:center;
opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{opacity:1;}
.me-icon{background:transparent!important; border:0!important;}
.me-core{position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:#ff2d78; border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.5); box-sizing:border-box;}
.me-pulse{position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:#ff2d78; opacity:.55; animation:mepulse 1.8s ease-out infinite;}
@keyframes mepulse{0%{transform:scale(1); opacity:.55;} 70%{transform:scale(3.4); opacity:0;} 100%{transform:scale(3.4); opacity:0;}}
.togglerow{display:flex; gap:18px; flex-wrap:wrap; align-items:center;}
#roundsToggle[hidden]{display:none!important;}
.rbadge-icon{background:transparent!important; border:0!important;}
.rbadge{width:28px; height:28px; border-radius:50%; color:#fff; font-family:var(--font-display); font-weight:800; font-size:13px; line-height:23px; text-align:center; border:2.5px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.45); box-sizing:border-box; cursor:pointer; transition:transform .15s;}
.rbadge.focus{transform:scale(1.25); box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 2px 10px rgba(0,0,0,.55);}
.badge.rnd{background:#fff; border:2px solid currentColor; padding:2px 9px;}
.compass{position:absolute; left:12px; bottom:calc(env(safe-area-inset-bottom,0) + 40px); z-index:1100; width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--electi); box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
.compass[hidden]{display:none!important;}
.compass svg{display:block; transform-origin:50% 50%;}
.compass:active{background:var(--electi-tint);}
</style>
</head>

// Rotasjon (leaflet-rotate): to-finger-rotasjon med dødsone, så en vanlig pinch-zoom ikke vrir kartet ved et uhell.
var ROT_DEADZONE = 12, ROT_MINDIST = 50, ROT_SNAP = 4;
function rotNorm(d){ d = d % 360; if(d > 180) d -= 360; if(d <= -180) d += 360; return d; }
if(L.Map.TouchGestures){
var __tg = L.Map.TouchGestures.prototype, __tgStart = __tg._onTouchStart, __tgMove = __tg._onTouchMove, __tgEnd = __tg._onTouchEnd;
L.Map.TouchGestures.include({
_onTouchStart: function(e){
this._rotEngaged = false;
__tgStart.call(this, e);
if(this._rotating && e.touches && e.touches.length === 2){
var p1 = this._map.mouseEventToContainerPoint(e.touches[0]), p2 = this._map.mouseEventToContainerPoint(e.touches[1]);
this._rotStartFlip = (p1.y - p2.y) < 0 ? 180 : 0;
}
},
_onTouchMove: function(e){
if(this._rotating && !this._rotEngaged && e.touches && e.touches.length === 2){
var map = this._map, p1 = map.mouseEventToContainerPoint(e.touches[0]), p2 = map.mouseEventToContainerPoint(e.touches[1]), v = p1.subtract(p2);
var theta = Math.atan(v.x / v.y), d = (theta - this._startTheta) * L.DomUtil.RAD_TO_DEG;
if(v.y < 0) d += 180;
d = rotNorm(d - this._rotStartFlip);
if(Math.abs(d) < ROT_DEADZONE || p1.distanceTo(p2) < ROT_MINDIST){
this._rotating = false;
try{ __tgMove.call(this, e); } finally{ this._rotating = true; }
return;
}
// dreiningen starter her, uten hopp: bare vridningen ut over dødsonen følger fingrene
this._rotEngaged = true;
this._startTheta = theta - (d - Math.sign(d) * ROT_DEADZONE) * L.DomUtil.DEG_TO_RAD;
this._startBearing = map.getBearing() + (v.y < 0 ? 180 : 0);
}
__tgMove.call(this, e);
},
_onTouchEnd: function(e){
var moved = this._moved, active = this._zooming || this._rotating, map = this._map;
this._rotEngaged = false;
if(!moved || !active){
this._zooming = false; this._rotating = false;
L.DomEvent.off(document, "touchmove", this._onTouchMove, this).off(document, "touchend touchcancel", this._onTouchEnd, this);
return;
}
__tgEnd.call(this, e);
if(map._rotate){ var b = rotNorm(map.getBearing()); if(b && Math.abs(b) <= ROT_SNAP) animateBearing(0, 180); }
}
});
}
var map = L.map("map", {zoomControl:true, tap:true, rotate:true, bearing:0, touchRotate:true, rotateControl:false});
var compassBtn = document.getElementById("compass"), rotAnim = null, rotGuard = null;
function animateBearing(target, ms){
if(!map._rotate) return;
var b0 = map.getBearing(), d = rotNorm(target - b0), t0 = null;
if(rotAnim){ cancelAnimationFrame(rotAnim); rotAnim = null; }
if(rotGuard){ clearTimeout(rotGuard); rotGuard = null; }
if(!d){ map.setBearing(target); return; }
function step(ts){
if(t0 === null) t0 = ts;
var k = Math.min(1, (ts - t0) / ms), ease = 1 - Math.pow(1 - k, 3);
map.setBearing(k < 1 ? b0 + d * ease : target);
rotAnim = k < 1 ? requestAnimationFrame(step) : null;
}
rotAnim = requestAnimationFrame(step);
// vakt: fullfør uansett (requestAnimationFrame står stille i en skjult fane)
rotGuard = setTimeout(function(){ rotGuard = null; if(rotAnim){ cancelAnimationFrame(rotAnim); rotAnim = null; map.setBearing(target); } }, ms + 250);
}
function updateCompass(){
if(!compassBtn) return;
var b = map._rotate ? map.getBearing() : 0;
compassBtn.hidden = Math.abs(rotNorm(b)) <= 0.5;
var svg = compassBtn.querySelector("svg"); if(svg) svg.style.transform = "rotate(" + b + "deg)";
}
if(map._rotate){
// egne paneler (f.eks. runde-omrissene) skal rotere med kartet
var __createPane = map.createPane;
map.createPane = function(name, container){ return __createPane.call(this, name, container || this._rotatePane); };
// fitBounds-padding (topp-feltet) skal gjelde i skjermretning også når kartet er dreid
map._getBoundsCenterZoom = function(bounds, options){
options = options || {};
bounds = bounds.getBounds ? bounds.getBounds() : L.latLngBounds(bounds);
var paddingTL = L.point(options.paddingTopLeft || options.padding || [0, 0]), paddingBR = L.point(options.paddingBottomRight || options.padding || [0, 0]);
var zoom = this.getBoundsZoom(bounds, false, paddingTL.add(paddingBR));
zoom = (typeof options.maxZoom === "number") ? Math.min(options.maxZoom, zoom) : zoom;
if(zoom === Infinity) return {center: bounds.getCenter(), zoom: zoom};
var paddingOffset = paddingBR.subtract(paddingTL).divideBy(2);
if(this._bearing) paddingOffset = paddingOffset.rotate(-this._bearing);
var swPoint = this.project(bounds.getSouthWest(), zoom), nePoint = this.project(bounds.getNorthEast(), zoom);
return {center: this.unproject(swPoint.add(nePoint).divideBy(2).add(paddingOffset), zoom), zoom: zoom};
};
map.on("rotate", updateCompass);
if(compassBtn) compassBtn.addEventListener("click", function(){ animateBearing(0, 260); });
updateCompass();
if(L.Browser.touch) setTimeout(function(){
var seen = false; try{ seen = localStorage.getItem("dorkart_rotatetips") === "1"; localStorage.setItem("dorkart_rotatetips", "1"); }catch(e){}
if(!seen && typeof toast === "function") toast("Nytt: drei kartet med to fingre. Trykk kompasset nede til venstre for å få nord opp igjen.");
}, 6500);
}
var KV = "https://cache.kartverket.no/v1/wmts/1.0.0/";
var kvFarge = L.tileLayer(KV+"topo/default/webmercator/{z}/{y}/{x}.png", {maxNativeZoom:18, maxZoom:19, attribution:"© Kartverket"});
var kvGraa = L.tileLayer(KV+"topograatone/default/webmercator/{z}/{y}/{x}.png", {maxNativeZoom:18, maxZoom:19, attribution:"© Kartverket"});
kvFarge.addTo(map);
L.control.layers({"Kartverket farge":kvFarge, "Kartverket gråtone":kvGraa}, null, {position:"topright", collapsed:true}).addTo(map);
// Grupper dører som deler (nesten) samme koordinat = flere boenheter på samme punkt.
var __stacks = {};
DATA.forEach(function(d){
var key = d.lat.toFixed(5)+","+d.lon.toFixed(5);
(__stacks[key] = __stacks[key] || []).push(d);
});
DATA.forEach(function(d){
var s = __stacks[d.lat.toFixed(5)+","+d.lon.toFixed(5)];
d._stack = s; d._stackN = s.length;
if(s.length > 1){
var i = s.indexOf(d), ang = (2*Math.PI*i/s.length) - Math.PI/2;
d._ox = Math.cos(ang); d._oy = Math.sin(ang);
} else { d._ox = 0; d._oy = 0; }
});
var group = L.layerGroup().addTo(map);
DATA.forEach(function(d){
var g = GROUPS[d.grp] || GROUPS["Kun mobil"];
var m = L.circleMarker([d.lat, d.lon], {radius:8, color:"#ffffff", weight:2, fillColor:g.raw, fillOpacity:1});
m.on("click", function(){ openSheet(d); });
d._m = m;
});
// Vifte ut overlappende markører i pikselrom, så hver boenhet blir en egen prikk på alle zoom-nivåer.
var STACK_PX = 15;
function layoutStacks(){
if(!map._loaded) return;
DATA.forEach(function(d){
if(d._stackN > 1){
try{
var base = map.latLngToLayerPoint([d.lat, d.lon]);
d._m.setLatLng(map.layerPointToLatLng(L.point(base.x + d._ox*STACK_PX, base.y + d._oy*STACK_PX)));
}catch(e){}
}
});
}
map.on("zoomend", layoutStacks);
function fitB(b){ var tb=document.querySelector(".topbar"); var th=tb?tb.getBoundingClientRect().height:0; map.fitBounds(b, {paddingTopLeft:[40, th+30+((typeof showRounds!=="undefined" && showRounds && typeof ROUNDS!=="undefined" && ROUNDS.length) ? 36 : 0)], paddingBottomRight:[40,40], maxZoom:16}); }
function bounds(pred){
var pts = DATA.filter(pred).map(function(d){ return [d.lat, d.lon]; });
return pts.length ? L.latLngBounds(pts) : null;
}
function visible(d){
if(!activeGroups.has(d.grp)) return false;
if(area !== "alle" && d.area !== area) return false;
if(done.has(d.bnr) && !showDone && !appts[d.bnr]) return false;
return true;
}
function refresh(){
DATA.forEach(function(d){
var m = d._m, on = visible(d);
if(on){
if(!group.hasLayer(m)) group.addLayer(m);
if(appts[d.bnr]){ m.setStyle({color:"#e8a90c", weight:3, fillOpacity:1}); m.bringToFront(); }
else { m.setStyle({color:"#ffffff", fillOpacity: done.has(d.bnr) ? 0.30 : 1, weight: done.has(d.bnr) ? 1 : 2}); }
} else { if(group.hasLayer(m)) group.removeLayer(m); }
});
updateCounts();
}
function updateCounts(){
var rem = 0;
Object.keys(GROUPS).forEach(function(k){
var n = DATA.filter(function(d){ return d.grp===k && !done.has(d.bnr) && (area==="alle" || d.area===area); }).length;
var el = document.getElementById("cnt-"+cssKey(k));
if(el) el.textContent = n;
if(activeGroups.has(k)) rem += n;
});
document.getElementById("remN").textContent = rem;
var na = DATA.filter(function(d){ return appts[d.bnr]; }).length;
var al = document.getElementById("apptline");
if(na>0){
al.hidden=false;
al.innerHTML='<button id="apptZoom">📅 '+na+' avtale'+(na>1?'r':'')+'</button>';
document.getElementById("apptZoom").onclick=openApptList;
} else { al.hidden=true; al.innerHTML=""; }
}
function cssKey(k){ return k.replace(/[^a-zA-Z]/g,""); }
// Omraadefaner (bare hvis mer enn ett omraade)
var tabs = document.getElementById("areatabs");
function setArea(a, btn){
area = a;
tabs.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
if(btn) btn.classList.add("on");
var bb = bounds(function(d){ return area==="alle" || d.area===area; });
if(bb) fitB(bb);
refresh();
}
if(AREAS.length > 1){
var mk = function(label, val){
var b=document.createElement("button"); b.textContent=label;
b.addEventListener("click", function(){ setArea(val, b); });
tabs.appendChild(b); return b;
};
var allBtn = mk("Alle","alle"); allBtn.classList.add("on");
AREAS.forEach(function(a){ mk(a, a); });
} else {
tabs.style.display = "none";
}
var chips = document.getElementById("chips");
Object.keys(GROUPS).forEach(function(k){
var g = GROUPS[k];
var c = document.createElement("div"); c.className = "chip";
c.innerHTML = '<span class="dot" style="background:'+g.raw+'"></span>'+g.label+' <span class="n" id="cnt-'+cssKey(k)+'">0</span>';
c.addEventListener("click", function(){
if(activeGroups.has(k)){ activeGroups.delete(k); c.classList.add("off"); }
else { activeGroups.add(k); c.classList.remove("off"); }
refresh();
});
chips.appendChild(c);
});
document.getElementById("showdone").addEventListener("change", function(e){ showDone = e.target.checked; refresh(); });
var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function pad2(n){ return (n<10?"0":"")+n; }
function fmtWhen(a){ var p=a.date.split("-"); return p[2]+"."+p[1]+"."+p[0].slice(2)+" kl "+a.time; }
function escH(s){ return (""+s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function apptSorted(){
var arr=DATA.filter(function(d){ return appts[d.bnr]; }).map(function(d){ return {d:d, a:appts[d.bnr]}; });
arr.sort(function(x,y){ var kx=x.a.date+"T"+x.a.time, ky=y.a.date+"T"+y.a.time; return kx<ky?-1:(kx>ky?1:0); });
return arr;
}
function openApptList(){
closeSheet();
var arr=apptSorted(), body=document.getElementById("apptListBody"), now=Date.now();
if(!arr.length){ body.innerHTML='<div class="appt-empty">Ingen avtaler ennå.</div>'; }
else {
body.innerHTML=arr.map(function(it,i){
var g=GROUPS[it.d.grp]||GROUPS["Kun mobil"];
var t=new Date(it.a.date+"T"+it.a.time).getTime();
var past=(!isNaN(t) && t<now) ? " past" : "";
return '<button class="appt-item" data-i="'+i+'">'+
'<span class="appt-dot" style="background:'+g.raw+'"></span>'+
'<span class="appt-item-main"><span class="appt-item-addr">'+escH(it.d.navn)+'</span>'+

'<span class="appt-item-when'+past+'">'+fmtWhen(it.a)+'</span></button>';

Array.prototype.forEach.call(body.querySelectorAll(".appt-item"), function(btn){

}
function closeApptList(){ document.getElementById("apptSheet").classList.remove("open"); scrim.classList.remove("open"); }
function goToAppt(d){ closeApptList(); map.setView([d.lat,d.lon], 18, {animate:true}); openSheet(d); }
// Adressesøk
function renderSearch(q){
var box=document.getElementById("searchResults");
q=(q||"").trim().toLowerCase();
if(q.length<2){ box.hidden=true; box.innerHTML=""; return; }
var hits=DATA.filter(function(d){ return (d.navn+" "+d.adr).toLowerCase().indexOf(q)>=0; });
hits.sort(function(a,b){
var ai=a.navn.toLowerCase().indexOf(q)===0?0:1, bi=b.navn.toLowerCase().indexOf(q)===0?0:1;
if(ai!==bi) return ai-bi;
return a.navn.localeCompare(b.navn,"no");
});
hits=hits.slice(0,8);
if(!hits.length){ box.hidden=false; box.innerHTML='<div class="search-empty">Ingen treff</div>'; return; }
box.hidden=false;
box.innerHTML=hits.map(function(d){
var g=GROUPS[d.grp]||GROUPS["Kun mobil"];
var ssub = escH(d.adr) + (d._stackN>1 ? ' · Bolig '+escH(d.bol) : '');
return '<button class="search-item" data-bnr="'+escH(d.bnr)+'"><span class="appt-dot" style="background:'+g.raw+'"></span><span class="search-main"><span class="search-addr">'+escH(d.navn)+'</span><span class="search-sub">'+ssub+'</span></span></button>';
}).join("");
Array.prototype.forEach.call(box.querySelectorAll(".search-item"), function(btn){
btn.addEventListener("click", function(){
var bnr=btn.getAttribute("data-bnr"), d=null;
for(var i=0;i<DATA.length;i++){ if(String(DATA[i].bnr)===String(bnr)){ d=DATA[i]; break; } }
if(d) goToSearchDoor(d);
});
});
}
function hideSearch(){ var box=document.getElementById("searchResults"); if(box) box.hidden=true; }
function goToSearchDoor(d){
hideSearch();
if(d._m && !group.hasLayer(d._m)) group.addLayer(d._m);
map.setView([d.lat, d.lon], 18, {animate:true});
openSheet(d);
}
(function(){
var si=document.getElementById("searchInput"); if(!si) return;
var sc=document.getElementById("searchClear"), wrap=si.parentNode;
si.addEventListener("input", function(){ sc.hidden = !si.value; renderSearch(si.value); });

sc.addEventListener("click", function(){ si.value=""; sc.hidden=true; hideSearch(); si.focus(); });
document.addEventListener("click", function(e){ if(!wrap.contains(e.target)) hideSearch(); });
})();

function icsUri(d,a){
var dt=a.date.replace(/-/g,""), tm=a.time.replace(":","")+"00", start=dt+"T"+tm;
var sfurl = d.sfid ? (SF_BASE+"/lightning/r/"+d.sfid+"/view") : "";
var sum="Besøk: "+d.navn;
var desc="Electi dørsalg. Besøksnr "+d.bnr+(sfurl?" — "+sfurl:"");
if(ICS_ENDPOINT){
return ICS_ENDPOINT+(ICS_ENDPOINT.indexOf("?")>=0?"&":"?")+"start="+start+"&dur=30&uid="+encodeURIComponent(d.bnr+"-"+start)+"&sum="+encodeURIComponent(sum)+"&loc="+encodeURIComponent(d.adr)+"&desc="+encodeURIComponent(desc);
}
var hh=parseInt(a.time.slice(0,2),10), mm=parseInt(a.time.slice(3,5),10);
var em=mm+30, eh=hh+Math.floor(em/60); em=em%60; eh=eh%24;
var end=dt+"T"+pad2(eh)+pad2(em)+"00";
var n=new Date(), stamp=n.getUTCFullYear()+pad2(n.getUTCMonth()+1)+pad2(n.getUTCDate())+"T"+pad2(n.getUTCHours())+pad2(n.getUTCMinutes())+pad2(n.getUTCSeconds())+"Z";
function esc(s){ return (""+s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); }
var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Electi//Dorkart//NO","METHOD:PUBLISH","CALSCALE:GREGORIAN","BEGIN:VEVENT",
"UID:"+d.bnr+"-"+start+"@electi-dorkart","DTSTAMP:"+stamp,"DTSTART:"+start,"DTEND:"+end,
"SUMMARY:"+esc(sum),"LOCATION:"+esc(d.adr),"DESCRIPTION:"+esc(desc),
"BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY","DESCRIPTION:"+esc("Besøk om 15 min: "+d.navn),"END:VALARM",
"END:VEVENT","END:VCALENDAR"];
var ics=L.join("\r\n");
try{ if(window.__apptBlob) URL.revokeObjectURL(window.__apptBlob); }catch(e){}
try{ window.__apptBlob = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"})); return window.__apptBlob; }
catch(e){ return "data:text/calendar;charset=utf-8,"+encodeURIComponent(ics); }
}

var cur = null;

document.getElementById("sAddr").textContent = d.navn;

var badges = '<span class="badge" style="background:'+g.raw+'">'+g.label+'</span>' + '<span class="badge status">'+d.st+'</span>';
var rr0 = (d.r && typeof roundOf==="function") ? roundOf(d.r) : null;
if(rr0) badges += '<span class="badge rnd" style="color:'+rr0.c+'">Runde '+d.r+'</span>';
if(done.has(d.bnr)) badges += '<span class="badge done-badge">Fullført</span>';
document.getElementById("sBadges").innerHTML = badges;
if(d.sfid){
document.getElementById("sMeta").innerHTML = '<a class="sflink" href="' + SF_BASE + '/lightning/r/' + d.sfid + '/view" target="_blank" rel="noopener">Besøksnr ' + d.bnr + ' ↗</a> · Bolig ' + d.bol;
} else {
document.getElementById("sMeta").textContent = "Besøksnr " + d.bnr + " · Bolig " + d.bol;
}
var stackBox = document.getElementById("sStack");
if(d._stackN > 1){
stackBox.hidden = false;
var sameNavn = d._stack.every(function(s){ return s.navn === d.navn; });
var sibs = d._stack.slice().sort(function(a,b){ return (""+a.bol).localeCompare(""+b.bol,"no"); });
stackBox.innerHTML = '<div class="stack-head">🏠 '+d._stackN+' boenheter her</div>' + sibs.map(function(sd){
var g2 = GROUPS[sd.grp] || GROUPS["Kun mobil"];
var isCur = String(sd.bnr) === String(d.bnr);
var chk = done.has(sd.bnr) ? ' <span class="stack-check">✓</span>' : '';
var primary = (sameNavn ? "" : escH(sd.navn)+" · ") + "Bolig " + escH(sd.bol) + (isCur ? " (denne)" : "") + chk;
var link = sd.sfid ? '<a class="mini" href="'+SF_BASE+'/lightning/r/'+sd.sfid+'/view" target="_blank" rel="noopener">Besøk ↗</a>' : '';
return '<button class="stack-item'+(isCur?' cur':'')+'" data-bnr="'+escH(sd.bnr)+'">'+

if(f){ document.getElementById("remN").textContent = DATA.filter(function(d){ return d.r===f && activeGroups.has(d.grp) && !done.has(d.bnr); }).length; if(rs) rs.textContent = " i runde "+f; }
else if(rs) rs.textContent = "";
}
var refresh0 = refresh;
refresh = function(){ refresh0(); applyFocus(); };
function setFocus(n){
focusRound = n; if(tipTimer){ clearTimeout(tipTimer); tipTimer = null; } try{ localStorage.setItem(RUNDER_KEY+"_fokus", String(n)); }catch(e){}
refresh();
if(n){ var r = roundOf(n), bb = roundBounds(n); if(bb) fitB(bb); toast("Runde "+n+" valgt: "+r.s+" HP/HC/Vula"+(r.m ? " + "+r.m+" kun mobil" : "")+". Trykk nummeret igjen for å se alle runder."); }
else { var ab = bounds(function(d){ return !!d.r; }); if(ab) fitB(ab); toast("Alle runder vises."); }
}
if(ROUNDS.length){
map.createPane("rounds"); map.getPane("rounds").style.zIndex = 350;
ROUNDS.forEach(function(r){
r.h.forEach(function(poly){ var p = L.polygon(poly, {pane:"rounds", color:r.c, weight:3, opacity:0.9, fillColor:r.c, fillOpacity:0.08, interactive:false}).addTo(roundLayer); (roundPolys[r.n] = roundPolys[r.n] || []).push(p); });
r.b.forEach(function(pt){
var bm = L.marker(pt, {icon:L.divIcon({className:"rbadge-icon", html:'<div class="rbadge" style="background:'+r.c+'">'+r.n+'</div>', iconSize:[28,28], iconAnchor:[14,31]}), keyboard:false, zIndexOffset:500, title:"Runde "+r.n});
bm.on("click", function(){ setFocus(focusRound===r.n ? 0 : r.n); });
bm.addTo(roundLayer); (roundBadges[r.n] = roundBadges[r.n] || []).push(bm);
});
});
document.getElementById("roundsToggle").hidden = false;
var rcb = document.getElementById("showrounds"); rcb.checked = showRounds;
rcb.addEventListener("change", function(e){ showRounds = e.target.checked; try{ localStorage.setItem(RUNDER_KEY, showRounds ? "1" : "0"); }catch(err){} applyRounds(); refresh(); });
}
applyRounds();
if(ROUNDS.length && showRounds){
var seen = false; try{ seen = localStorage.getItem(RUNDER_KEY+"_tips")==="1"; localStorage.setItem(RUNDER_KEY+"_tips","1"); }catch(e){}
if(!seen) tipTimer = setTimeout(function(){ tipTimer = null; toast("Én runde per salgsdag. Trykk et rundenummer for å velge dagens runde."); }, 1500);
}
var all = (ROUNDS.length && showRounds && focusRound ? roundBounds(focusRound) : null) || (ROUNDS.length ? bounds(function(d){ return !!d.r; }) : null) || bounds(function(){ return true; });
if(all) fitB(all);
refresh();
layoutStacks(); setTimeout(layoutStacks, 300);
fitTopbar(); window.addEventListener("load", fitTopbar); setTimeout(fitTopbar, 400);
</script>
