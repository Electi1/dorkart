<style>
:root{
--hp:#2f9e57; --hc:#2f6fe0; --vula:#e07d2f; --mobil:#6b7683;
--electi:#000089; --electi-dark:#000063; --electi-tint:#ecedf7;
--bg:#ffffff; --ink:#12181f; --muted:#5c6773; --line:#e4e8ee;
--shadow:0 6px 24px rgba(10,20,40,.18);
--font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
--font-display: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%; font-family:var(--font); color:var(--ink); background:var(--bg);}
#map{position:absolute; inset:0; z-index:0;}
.topbar{ position:absolute; top:0; left:0; right:0; z-index:1000; }
.brandbar{
background:var(--electi); color:#fff;
padding:calc(env(safe-area-inset-top,0) + 9px) 13px 9px;
display:flex; align-items:center; justify-content:space-between; gap:10px;
box-shadow:0 2px 12px rgba(0,0,90,.30);
}
.controls{
background:rgba(255,255,255,.96); backdrop-filter:saturate(1.4) blur(6px);
border-bottom:1px solid var(--line);
padding:8px 12px;
}
.brand{display:flex; align-items:center; gap:11px; min-width:0;}
.brand .logo{height:38px; width:auto; flex:none; display:block;}
.brand .vr{width:1px; align-self:stretch; background:rgba(255,255,255,.28); margin:4px 0;}
.brandtext{min-width:0; display:flex; flex-direction:column; justify-content:center;}
.title{font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:.2px; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brandtext .date{font-size:11.5px; color:rgba(255,255,255,.72); font-weight:600; letter-spacing:.4px;}
.remaining{font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--electi); background:#fff; white-space:nowrap; padding:6px 12px; border-radius:999px; letter-spacing:.2px; box-shadow:0 1px 6px rgba(0,0,50,.30);}
.remaining b{font-size:14px; font-weight:800; margin-right:1px;}
.areatabs{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.areatabs button{
flex:1 1 auto; min-width:70px; padding:8px 8px; font-size:13px; font-weight:600; font-family:inherit;
border:1px solid var(--line); background:#f3f5f8; color:var(--muted);
border-radius:9px; cursor:pointer;
}
.areatabs button.on{background:var(--electi); color:#fff; border-color:var(--electi);}
.chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.chip{
display:inline-flex; align-items:center; gap:6px;
padding:6px 10px; border-radius:999px; font-size:12.5px; font-weight:600;
border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; user-select:none;
}
.chip .dot{width:11px; height:11px; border-radius:50%; flex:none;}
.chip .n{color:var(--muted); font-weight:600;}
.chip.off{opacity:.4; text-decoration:line-through;}
.showdone{margin-top:8px; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);}
.showdone input{width:17px; height:17px;}
.searchwrap{position:relative; margin-top:8px;}
.searchwrap input{width:100%; font:inherit; font-size:15px; padding:11px 36px 11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
.searchwrap input::placeholder{color:var(--muted);}
.searchwrap input:focus{outline:none; border-color:var(--electi);}
.search-clear{position:absolute; top:9px; right:6px; border:none; background:none; font-size:19px; color:var(--muted); cursor:pointer; line-height:1; padding:6px 8px;}
.searchresults{position:absolute; top:calc(100% + 5px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:1400; max-height:min(52vh,340px); overflow-y:auto; -webkit-overflow-scrolling:touch;}
.search-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; border:none; border-bottom:1px solid var(--line); padding:11px 12px; cursor:pointer; font:inherit;}
.search-item:last-child{border-bottom:none;}
.search-item:active{background:#f5f7fb;}
.search-main{display:flex; flex-direction:column; min-width:0;}
.search-addr{font-weight:700; font-size:14.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.search-sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.search-empty{padding:12px; color:var(--muted); font-size:13.5px;}
.sheet{
position:absolute; left:0; right:0; bottom:0; z-index:1200;
background:#fff; border-radius:18px 18px 0 0; box-shadow:var(--shadow);
padding:16px 16px calc(env(safe-area-inset-bottom,0) + 16px);
transform:translateY(120%); transition:transform .22s ease; max-width:640px; margin:0 auto;
}
.sheet.open{transform:translateY(0);}
.sheet .grab{width:40px; height:4px; border-radius:3px; background:#d7dde5; margin:0 auto 12px;}
.sheet .addr{font-family:var(--font-display); font-size:19px; font-weight:700; line-height:1.25;}
.sheet .sub{font-size:13.5px; color:var(--muted); margin-top:3px;}
.badges{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 4px;}
.badge{font-size:12.5px; font-weight:700; color:#fff; padding:4px 10px; border-radius:999px;}
.badge.status{background:#eef1f5; color:var(--ink);}
.sheet .meta{font-size:13px; color:var(--muted); margin-top:8px;}
.actions{display:flex; gap:10px; margin-top:16px;}
.actions a, .actions button{
flex:1; text-align:center; padding:14px 8px; border-radius:12px;
font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; border:none; text-decoration:none;
}
.btn-nav{background:var(--electi); color:#fff;}
.btn-done{background:var(--ink); color:#fff;}
.btn-undo{background:#f3f5f8; color:var(--ink); border:1px solid var(--line);}
.sheet .close{position:absolute; top:12px; right:14px; font-size:22px; color:var(--muted); background:none; border:none; cursor:pointer; line-height:1;}
.scrim{position:absolute; inset:0; background:rgba(10,20,40,.28); z-index:1150; opacity:0; pointer-events:none; transition:opacity .2s;}
.scrim.open{opacity:1; pointer-events:auto;}
.leaflet-top.leaflet-right{margin-top:172px;}
.done-badge{background:#eef1f5; color:var(--muted);}
.meta a.sflink{color:var(--electi); font-weight:700; text-decoration:none;}
.meta a.mini{color:var(--electi); font-weight:700; text-decoration:none; white-space:nowrap;}
.stackbox{margin-top:12px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff;}
.stack-head{font-size:12.5px; font-weight:700; color:var(--electi); background:var(--electi-tint); padding:9px 12px;}
.stack-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; border:none; border-top:1px solid var(--line); padding:11px 12px; cursor:pointer; font:inherit;}
.stack-item:active{background:#f5f7fb;}
.stack-item.cur{background:#f3f5fb; cursor:default;}
.stack-main{display:flex; flex-direction:column; min-width:0; flex:1;}
.stack-bol{font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stack-sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stack-item .mini{flex:none;}
.stack-check{color:var(--hp); font-weight:800;}
.apptbox{margin-top:12px; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#f8f9fc;}
.apptbox.has{background:#fff7e6; border-color:#f0d488;}
.appt-row{display:flex; align-items:center; gap:8px;}
.appt-title{font-weight:700; font-size:14px; display:flex; align-items:center; gap:7px;}
.appt-when{font-family:var(--font-display); font-weight:800; color:#8a6d1a;}
.appt-form{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.appt-form input{font:inherit; padding:10px 11px; border:1px solid var(--line); border-radius:9px; flex:1 1 130px; min-width:120px; background:#fff;}
.appt-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.appt-actions button, .appt-actions a{font:inherit; font-weight:700; font-size:13.5px; padding:10px 13px; border-radius:9px; cursor:pointer; border:none; text-decoration:none; text-align:center;}
.appt-save{background:var(--electi); color:#fff;}
.appt-cal{background:#e8a90c; color:#3a2c00;}
.appt-open{background:#eef1f6; color:var(--electi);}
.appt-del{background:#eef1f6; color:#b3261e;}
.apptline{margin-top:9px;}
.apptline button{font:inherit; font-weight:700; font-size:12.5px; color:#8a6d1a; background:#fff7e6; border:1px solid #f0d488; border-radius:999px; padding:6px 12px; cursor:pointer;}
.apptsheet{max-height:min(72vh, 540px); display:flex; flex-direction:column;}
.apptsheet .apptsheet-title{font-family:var(--font-display); font-size:19px; font-weight:800; color:var(--electi);}
.apptsheet .apptsheet-hint{font-size:12.5px; color:var(--muted); margin:2px 0 10px;}
.appt-list{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0 -2px; padding:2px 2px 0;}
.appt-item{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:9px; cursor:pointer; font:inherit;}
.appt-item:active{background:#f5f7fb;}
.appt-dot{width:13px; height:13px; border-radius:50%; flex:none; box-shadow:0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.10);}
.appt-item-main{display:flex; flex-direction:column; min-width:0; flex:1;}
.appt-item-addr{font-weight:700; font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.appt-item-sub{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.appt-item-when{font-family:var(--font-display); font-weight:800; font-size:13px; color:#8a6d1a; background:#fff7e6; border:1px solid #f0d488; border-radius:999px; padding:5px 10px; flex:none; white-space:nowrap;}
.appt-item-when.past{color:var(--muted); background:#eef1f5; border-color:var(--line);}
.appt-empty{color:var(--muted); font-size:14px; padding:10px 2px;}
.locate{
position:absolute; right:12px; bottom:calc(env(safe-area-inset-bottom,0) + 40px); z-index:1100;
width:48px; height:48px; border-radius:50%; border:1px solid var(--line);
background:#fff; color:var(--electi); box-shadow:var(--shadow); cursor:pointer;
display:flex; align-items:center; justify-content:center; padding:0;
}
.locate.on{background:var(--electi); color:#fff; border-color:var(--electi);}
.toast{
position:absolute; left:50%; transform:translateX(-50%);
bottom:calc(env(safe-area-inset-bottom,0) + 100px); z-index:1300;
background:rgba(18,24,31,.92); color:#fff; font-size:13px; font-weight:600;
padding:10px 14px; border-radius:10px; max-width:80%; text-align:center;
opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{opacity:1;}
.me-icon{background:transparent!important; border:0!important;}
.me-core{position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:#ff2d78; border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.5); box-sizing:border-box;}
.me-pulse{position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:#ff2d78; opacity:.55; animation:mepulse 1.8s ease-out infinite;}
@keyframes mepulse{0%{transform:scale(1); opacity:.55;} 70%{transform:scale(3.4); opacity:0;} 100%{transform:scale(3.4); opacity:0;}}
.togglerow{display:flex; gap:18px; flex-wrap:wrap; align-items:center;}
#roundsToggle[hidden]{display:none!important;}
.rbadge-icon{background:transparent!important; border:0!important;}
.rbadge{width:28px; height:28px; border-radius:50%; color:#fff; font-family:var(--font-display); font-weight:800; font-size:13px; line-height:23px; text-align:center; border:2.5px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.45); box-sizing:border-box; cursor:pointer; transition:transform .15s;}
.rbadge.focus{transform:scale(1.25); box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 2px 10px rgba(0,0,0,.55);}
.badge.rnd{background:#fff; border:2px solid currentColor; padding:2px 9px;}
.compass{position:absolute; left:12px; bottom:calc(env(safe-area-inset-bottom,0) + 40px); z-index:1100; width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--electi); box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
.compass[hidden]{display:none!important;}
.compass svg{display:block; transform-origin:50% 50%;}
.compass:active{background:var(--electi-tint);}
</style>
</head>
