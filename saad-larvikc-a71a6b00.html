function renderSearch(q){
var box=document.getElementById("searchResults");
q=(q||"").trim().toLowerCase();
if(q.length<2){ box.hidden=true; box.innerHTML=""; return; }
var hits=DATA.filter(function(d){ return (d.navn+" "+d.adr).toLowerCase().indexOf(q)>=0; });
hits.sort(function(a,b){
var ai=a.navn.toLowerCase().indexOf(q)===0?0:1, bi=b.navn.toLowerCase().indexOf(q)===0?0:1;
if(ai!==bi) return ai-bi;
return a.navn.localeCompare(b.navn,"no");
});
hits=hits.slice(0,8);
if(!hits.length){ box.hidden=false; box.innerHTML='<div class="search-empty">Ingen treff</div>'; return; }
box.hidden=false;
box.innerHTML=hits.map(function(d){
var g=GROUPS[d.grp]||GROUPS["Kun mobil"];
var ssub = escH(d.adr) + (d._stackN>1 ? ' · Bolig '+escH(d.bol) : '');
return '<button class="search-item" data-bnr="'+escH(d.bnr)+'"><span class="appt-dot" style="background:'+g.raw+'"></span><span class="search-main"><span class="search-addr">'+escH(d.navn)+'</span><span class="search-sub">'+ssub+'</span></span></button>';

if(d) goToSearchDoor(d);
});
});
}
function hideSearch(){ var box=document.getElementById("searchResults"); if(box) box.hidden=true; }
function goToSearchDoor(d){

function icsUri(d,a){
var dt=a.date.replace(/-/g,""), tm=a.time.replace(":","")+"00", start=dt+"T"+tm;
var sfurl = d.sfid ? (SF_BASE+"/lightning/r/"+d.sfid+"/view") : "";
var sum="Besøk: "+d.navn;
var desc="Electi dørsalg. Besøksnr "+d.bnr+(sfurl?" — "+sfurl:"");
if(ICS_ENDPOINT){
return ICS_ENDPOINT+(ICS_ENDPOINT.indexOf("?")>=0?"&":"?")+"start="+start+"&dur=30&uid="+encodeURIComponent(d.bnr+"-"+start)+"&sum="+encodeURIComponent(sum)+"&loc="+encodeURIComponent(d.adr)+"&desc="+encodeURIComponent(desc);
}
var hh=parseInt(a.time.slice(0,2),10), mm=parseInt(a.time.slice(3,5),10);
var em=mm+30, eh=hh+Math.floor(em/60); em=em%60; eh=eh%24;
var end=dt+"T"+pad2(eh)+pad2(em)+"00";
var n=new Date(), stamp=n.getUTCFullYear()+pad2(n.getUTCMonth()+1)+pad2(n.getUTCDate())+"T"+pad2(n.getUTCHours())+pad2(n.getUTCMinutes())+pad2(n.getUTCSeconds())+"Z";
function esc(s){ return (""+s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); }
var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Electi//Dorkart//NO","METHOD:PUBLISH","CALSCALE:GREGORIAN","BEGIN:VEVENT",
"UID:"+d.bnr+"-"+start+"@electi-dorkart","DTSTAMP:"+stamp,"DTSTART:"+start,"DTEND:"+end,
"SUMMARY:"+esc(sum),"LOCATION:"+esc(d.adr),"DESCRIPTION:"+esc(desc),
"BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY","DESCRIPTION:"+esc("Besøk om 15 min: "+d.navn),"END:VALARM",
"END:VEVENT","END:VCALENDAR"];
var ics=L.join("\r\n");
try{ if(window.__apptBlob) URL.revokeObjectURL(window.__apptBlob); }catch(e){}
try{ window.__apptBlob = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"})); return window.__apptBlob; }
catch(e){ return "data:text/calendar;charset=utf-8,"+encodeURIComponent(ics); }
}
