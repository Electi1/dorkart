#brandbar .right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
#apptBtn{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.5);

#apptBtn[hidden]{ display:none !important; }

#q:focus{ outline:none; border-color:var(--electi); }
#qclear{ position:absolute; right:4px; top:50%; transform:translateY(-50%); border:0; background:none;

#qres{ position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff; border:1px solid #ccd3db;

.btn.pri{ background:var(--electi); color:#fff; }

.actions{ display:flex; gap:8px; }

0000CTr4MAG"}];
var SELGER = "Ask Berntsen";
var DATO = "14.09.26";
var ICS_ENDPOINT = "https://electi-ics.daniel-kolstad.workers.dev/";
var SF_BASE = "https://cview.lightning.force.com";
var GRP = {"HP": "#2f9e57", "HC": "#2f6fe0", "HC Vula": "#e07d2f", "Kun mobil": "#6b7683"};
var GOLD = "#d4a017";
var STACK_PX = 15;

var KEY_DONE = "dorkart_" + SELGER + "_" + DATO;
var KEY_APPT = "dorkart_appt_" + SELGER;

function lsGet(k, fb){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var done = {}; (lsGet(KEY_DONE, []) || []).forEach(function(b){ done[b] = 1; });
var appts = lsGet(KEY_APPT, {}) || {};
function saveDone(){ lsSet(KEY_DONE, Object.keys(done)); }
function saveAppts(){ lsSet(KEY_APPT, appts); }

/* ---- stacks: doors sharing one coordinate ---- */
var stacks = {};
DATA.forEach(function(d){
  d._k = d.lat.toFixed(5) + "," + d.lon.toFixed(5);
  (stacks[d._k] = stacks[d._k] || []).push(d);
});
Object.keys(stacks).forEach(function(k){
  var arr = stacks[k], n = arr.length;
  var gates = {}; arr.forEach(function(d){ gates[d.g] = 1; });
  var mixed = Object.keys(gates).length > 1;
  arr.forEach(function(d, i){
    d._stackN = n; d._mixed = mixed;
    var ang = 2 * Math.PI * i / n - Math.PI / 2;
    d._ox = Math.cos(ang); d._oy = Math.sin(ang);
  });
});

/* ---- areas from poststed ---- */
var steder = []; DATA.forEach(function(d){ if(steder.indexOf(d.sted) < 0) steder.push(d.sted); });
steder.sort();
var area = "*";

/* ---- map ---- */
var map = L.map("map", { zoomControl:true, tap:false });
map.setView([DATA.length ? DATA[0].lat : 59.1400, DATA.length ? DATA[0].lon : 9.6600], 14);
var farge = L.tileLayer("https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png",
  { maxNativeZoom:18, maxZoom:19, attribution:"&copy; Kartverket" });
var graa = L.tileLayer("https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png",
  { maxNativeZoom:18, maxZoom:19, attribution:"&copy; Kartverket" });
farge.addTo(map);
L.control.layers({ "Kartverket farge": farge, "Kartverket gråtone": graa }, null, { position:"topright" }).addTo(map);

var active = {}; Object.keys(GRP).forEach(function(g){ active[g] = true; });
var showDone = false;

function colorOf(d){ return appts[d.b] ? GOLD : (GRP[d.grp] || "#6b7683"); }
function visible(d){
  if(area !== "*" && d.sted !== area) return false;
  if(!active[d.grp]) return false;
  if(done[d.b] && !showDone) return false;
  return true;
}

DATA.forEach(function(d){
  d._m = L.circleMarker([d.lat, d.lon], { radius:8, weight:2, color:"#fff", fillColor:colorOf(d), fillOpacity:1 });
  d._m.on("click", function(){ openDoor(d); });
});

function refresh(){
  DATA.forEach(function(d){
    var v = visible(d);
    if(v && !map.hasLayer(d._m)) d._m.addTo(map);
    if(!v && map.hasLayer(d._m)) map.removeLayer(d._m);
    if(v) d._m.setStyle({ fillColor: colorOf(d), fillOpacity: done[d.b] ? 0.3 : 1, opacity: done[d.b] ? 0.4 : 1 });
  });
  layoutStacks();
  var left = DATA.filter(function(d){
    return (area === "*" || d.sted === area) && active[d.grp] && !done[d.b];
  }).length;
  document.getElementById("leftPill").textContent = left + " igjen";
  Object.keys(GRP).forEach(function(g){
    var el = document.querySelector('.chip[data-g="' + g + '"] .n');
    if(el) el.textContent = DATA.filter(function(d){
      return d.grp === g && (area === "*" || d.sted === area) && !done[d.b];
    }).length;
  });
  var na = Object.keys(appts).length, ab = document.getElementById("apptBtn");
  ab.hidden = na === 0; ab.textContent = "📅 " + na + (na === 1 ? " avtale" : " avtaler");
}

function layoutStacks(){
  DATA.forEach(function(d){
    if(!d._stackN || d._stackN < 2) return;
    if(!map.hasLayer(d._m)) return;
    var base = map.latLngToLayerPoint([d.lat, d.lon]);
    d._m.setLatLng(map.layerPointToLatLng(L.point(base.x + d._ox * STACK_PX, base.y + d._oy * STACK_PX)));
  });
}
map.on("zoomend", layoutStacks);

/* ---- bottom sheet ---- */
var cur = null;
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sfUrl(d){ return d.sf ? (SF_BASE + "/lightning/r/" + d.sf + "/view") : ""; }
function unitLabel(d){ return (d._mixed ? d.g + " " : "") + (d.bo ? "Bolig " + d.bo : "Bolig –"); }

function openDoor(d){
  cur = d;
  document.getElementById("shTitle").textContent = d.g;
  document.getElementById("shFull").textContent = d.g + ", " + d.post + " " + d.sted;
  var bg = [];
  bg.push('<span class="badge" style="background:' + (GRP[d.grp] || "#6b7683") + '">' + esc(d.grp) + "</span>");
  bg.push('<span class="badge grey">' + esc(d.st) + "</span>");
  if(done[d.b]) bg.push('<span class="badge done">Fullført</span>');
  document.getElementById("shBadges").innerHTML = bg.join("");
  var bnrHtml = d.sf
    ? '<a href="' + esc(sfUrl(d)) + '" target="_blank" rel="noopener">Besøksnr ' + esc(d.b) + " ↗</a>"
    : "Besøksnr " + esc(d.b);
  document.getElementById("shMeta").innerHTML = bnrHtml + " · Bolig " + esc(d.bo || "–");

  var uw = document.getElementById("shUnits");
  if(d._stackN > 1){
    var arr = stacks[d._k], h = '<div class="units"><div class="hd">🏠 ' + arr.length + " boenheter her</div>";
    arr.forEach(function(u){
      h += '<div class="u' + (u === d ? " cur" : "") + '" data-b="' + esc(u.b) + '">'
        + '<span class="dot" style="background:' + (GRP[u.grp] || "#6b7683") + '"></span>'
        + '<span class="txt"><span class="p">' + esc(unitLabel(u)) + (u === d ? " (denne)" : "") + (done[u.b] ? " ✓" : "")
        + '</span><br><span class="sub">' + esc(u.grp) + " · " + esc(u.st) + "</span></span>"
        + (u.sf ? '<a class="vis" href="' + esc(sfUrl(u)) + '" target="_blank" rel="noopener">Besøk ↗</a>' : "")
        + "</div>";
    });
    uw.innerHTML = h + "</div>";
    uw.querySelectorAll(".u").forEach(function(row){
      row.addEventListener("click", function(ev){
        if(ev.target.closest("a")) return;
        var t = DATA.filter(function(x){ return x.b === row.getAttribute("data-b"); })[0];
        if(t) openDoor(t);
      });
    });
  } else { uw.innerHTML = ""; }

  var a = appts[d.b];
  document.getElementById("apDate").value = a ? a.slice(0, 10) : "";
  document.getElementById("apTime").value = a ? a.slice(11, 16) : "";
  document.getElementById("apDel").hidden = !a;
  document.getElementById("navBtn").href = "https://www.google.com/maps/dir/?api=1&destination=" + d.lat + "," + d.lon;
  document.getElementById("doneBtn").textContent = done[d.b] ? "Angre" : "Ferdig – fjern";
  document.getElementById("sheet").classList.add("open");
}
function closeSheet(id){ document.getElementById(id).classList.remove("open"); }
document.querySelectorAll("[data-close]").forEach(function(b){
  b.addEventListener("click", function(){ closeSheet(b.getAttribute("data-close")); });
});
document.getElementById("doneBtn").addEventListener("click", function(){
  if(!cur) return;
  if(done[cur.b]) delete done[cur.b]; else done[cur.b] = 1;
  saveDone(); refresh();
  document.getElementById("doneBtn").textContent = done[cur.b] ? "Angre" : "Ferdig – fjern";
  if(!showDone && done[cur.b]) closeSheet("sheet"); else openDoor(cur);
});

/* ---- appointments ---- */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function icsStamp(dt){
  return dt.getUTCFullYear() + pad(dt.getUTCMonth() + 1) + pad(dt.getUTCDate()) + "T"
    + pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + "00Z";
}
document.getElementById("apSave").addEventListener("click", function(){
  if(!cur) return;
  var dv = document.getElementById("apDate").value, tv = document.getElementById("apTime").value;
  if(!dv || !tv){ alert("Velg dato og klokkeslett."); return; }
  appts[cur.b] = dv + "T" + tv; saveAppts(); refresh();
  document.getElementById("apDel").hidden = false;
  var start = new Date(dv + "T" + tv);
  var sum = "Avtale " + cur.g, loc = cur.g + ", " + cur.post + " " + cur.sted;
  var uid = "dorkart-" + cur.b + "@electi";
  if(ICS_ENDPOINT){
    var u = ICS_ENDPOINT + "?start=" + encodeURIComponent(icsStamp(start)) + "&dur=30"
      + "&sum=" + encodeURIComponent(sum) + "&loc=" + encodeURIComponent(loc)
      + "&desc=" + encodeURIComponent("Besøksnr " + cur.b) + "&uid=" + encodeURIComponent(uid);
    window.location.href = u;
  } else {
    var end = new Date(start.getTime() + 30 * 60000);
    var ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Electi//dorkart//NO","BEGIN:VEVENT",
      "UID:" + uid, "DTSTAMP:" + icsStamp(new Date()), "DTSTART:" + icsStamp(start), "DTEND:" + icsStamp(end),
      "SUMMARY:" + sum, "LOCATION:" + loc, "BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY",
      "DESCRIPTION:" + sum, "END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
    var blob = new Blob([ics], { type:"text/calendar" });
    var a2 = document.createElement("a");
    a2.href = URL.createObjectURL(blob); a2.download = "avtale.ics"; a2.click();
  }
});
document.getElementById("apDel").addEventListener("click", function(){
  if(!cur) return;
  delete appts[cur.b]; saveAppts(); refresh();
  document.getElementById("apDate").value = ""; document.getElementById("apTime").value = "";
  document.getElementById("apDel").hidden = true;
});
document.getElementById("apptBtn").addEventListener("click", function(){
  var list = Object.keys(appts).map(function(b){
    var d = DATA.filter(function(x){ return x.b === b; })[0];
    return d ? { d:d, t:appts[b] } : null;
  }).filter(Boolean).sort(function(a, b){ return a.t < b.t ? -1 : 1; });
  var now = new Date(), h = "";
  list.forEach(function(it){
    var past = new Date(it.t) < now;
    h += '<div class="a' + (past ? " past" : "") + '" data-b="' + esc(it.d.b) + '">'
      + '<span class="dot" style="background:' + GOLD + '"></span>'
      + '<span class="txt"><span class="p">' + esc(it.d.g) + '</span><br><span class="s">'
      + esc(it.t.slice(8, 10) + "." + it.t.slice(5, 7) + " · Bolig " + (it.d.bo || "–")) + "</span></span>"
      + '<span class="tm">' + esc(it.t.slice(11, 16)) + "</span></div>";
  });
  var el = document.getElementById("apptList");
  el.innerHTML = h || "<p>Ingen avtaler.</p>";
  el.querySelectorAll(".a").forEach(function(row){
    row.addEventListener("click", function(){
      var t = DATA.filter(function(x){ return x.b === row.getAttribute("data-b"); })[0];
      if(!t) return;
      closeSheet("apptSheet"); map.setView([t.lat, t.lon], 18); setTimeout(function(){ openDoor(t); }, 150);
    });
  });
  document.getElementById("apptSheet").classList.add("open");
});

/* ---- chips / tabs / toggle ---- */
var chipHtml = "";
Object.keys(GRP).forEach(function(g){
  chipHtml += '<button class="chip" data-g="' + esc(g) + '"><span class="dot" style="background:' + GRP[g] + '"></span>'
    + esc(g) + ' <span class="n">0</span></button>';
});
document.getElementById("chips").innerHTML = chipHtml;
document.querySelectorAll("#chips .chip").forEach(function(c){
  c.addEventListener("click", function(){
    var g = c.getAttribute("data-g");
    active[g] = !active[g]; c.classList.toggle("off", !active[g]); refresh();
  });
});
if(steder.length > 1){
  var t = document.getElementById("tabs");
  t.hidden = false;
  var th = '<button data-a="*" class="on">Alle</button>';
  steder.forEach(function(s){ th += '<button data-a="' + esc(s) + '">' + esc(s) + "</button>"; });
  t.innerHTML = th;
  t.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      t.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on"); area = b.getAttribute("data-a"); refresh(); fit();
    });
  });
}
document.getElementById("showDone").addEventListener("change", function(){ showDone = this.checked; refresh(); });

/* ---- search ---- */
var q = document.getElementById("q"), qres = document.getElementById("qres"), qclear = document.getElementById("qclear");
function runSearch(){
  var v = q.value.trim().toLowerCase();
  qclear.style.display = v ? "block" : "none";
  if(!v){ qres.style.display = "none"; return; }
  var hits = DATA.filter(function(d){ return d.g.toLowerCase().indexOf(v) >= 0; }).slice(0, 40);
  if(!hits.length){ qres.innerHTML = '<div class="r"><span class="t">Ingen treff</span></div>'; qres.style.display = "block"; return; }
  qres.innerHTML = hits.map(function(d){
    var sub = d.post + " " + d.sted + " · " + d.grp + (d._stackN > 1 ? " · Bolig " + (d.bo || "–") : "");
    return '<div class="r" data-b="' + esc(d.b) + '"><span class="dot" style="background:' + colorOf(d)
      + '"></span><span><span class="t">' + esc(d.g) + '</span><br><span class="s">' + esc(sub) + "</span></span></div>";
  }).join("");
  qres.style.display = "block";
  qres.querySelectorAll(".r[data-b]").forEach(function(row){
    row.addEventListener("click", function(){
      var d = DATA.filter(function(x){ return x.b === row.getAttribute("data-b"); })[0];
      if(!d) return;
      qres.style.display = "none"; q.blur();
      map.setView([d.lat, d.lon], 18); setTimeout(function(){ openDoor(d); }, 150);
    });
  });
}
q.addEventListener("input", runSearch);
qclear.addEventListener("click", function(){ q.value = ""; runSearch(); });
document.addEventListener("click", function(e){
  if(!e.target.closest(".searchwrap")) qres.style.display = "none";
});

/* ---- geolocation ---- */
var meDot = null, meCirc = null;
document.getElementById("locbtn").addEventListener("click", function(){
  if(!navigator.geolocation){ alert("Posisjon støttes ikke."); return; }
  navigator.geolocation.watchPosition(function(p){
    var ll = [p.coords.latitude, p.coords.longitude];
    if(!meDot){
      meCirc = L.circle(ll, { radius:p.coords.accuracy, color:"#1a73e8", weight:1, fillOpacity:.12 }).addTo(map);
      meDot = L.circleMarker(ll, { radius:7, weight:3, color:"#fff", fillColor:"#1a73e8", fillOpacity:1 }).addTo(map);
      map.setView(ll, 17);
    } else { meDot.setLatLng(ll); meCirc.setLatLng(ll).setRadius(p.coords.accuracy); }
  }, function(){ alert("Fant ikke posisjon."); }, { enableHighAccuracy:true, maximumAge:10000 });
});

/* ---- init ---- */
function fit(){
  var pts = DATA.filter(visible).map(function(d){ return [d.lat, d.lon]; });
  if(!pts.length) pts = DATA.map(function(d){ return [d.lat, d.lon]; });
  if(pts.length) map.fitBounds(L.latLngBounds(pts), { padding:[30, 30] });
}
refresh(); fit(); layoutStacks();
window.DATA = DATA;
})();
</script>
